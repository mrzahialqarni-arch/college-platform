<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المنصة الموحدة للكليات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ثلاثة مستويات (كلية ← قسم ← عضو) فوق ملف Excel واحد؛ ملخص أولاً ثم التفاصيل */
  --ground:#F3F5F3; --surface:#FFFFFF; --ink:#18221D; --muted:#4A5852; --line:#DCE3DF; --soft:#EEF2EF;
  --accent:#0F6B4F; --accent-ink:#0A4D39; --accent-soft:#E6F2EC;
  --warn:#9A4B00; --warn-soft:#FFF4E5; --crit:#B42318; --crit-soft:#FDEEEC; --good:#0F6B4F;
  --font:'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select{font:inherit}
:focus-visible{outline:3px solid #2B7FD4;outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
header.top{background:var(--accent);padding:0 24px}
.top-in{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;min-height:80px}
.brand{display:flex;align-items:center;gap:14px}
.logo{background:#fff;border-radius:10px;padding:5px 10px;display:flex}
.logo img{height:52px;width:auto;display:block}
.brand b{display:block;color:#fff;font-size:18px}
.brand span{color:#CFE3D8;font-size:12px}
nav.levels{display:flex;flex-wrap:wrap;gap:4px}
nav.levels a{color:#DCEBE4;text-decoration:none;padding:12px 16px;border-radius:8px;min-height:44px;display:inline-flex;align-items:center}
nav.levels a:hover{background:#145E47;color:#fff}
nav.levels a[aria-current="page"]{background:var(--accent-ink);color:#fff;font-weight:600}
.bar{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 24px}
.bar-in{max-width:1360px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.src-state{font-size:13px;color:var(--muted);flex:1 1 320px}
.src-state b{color:var(--ink)}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 10px;font-weight:600}
.tag.sample{background:var(--warn-soft);color:var(--warn)}
.tag.real{background:var(--accent-soft);color:var(--accent-ink)}
.btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--accent-ink)}
.btn2{border:1px solid #C6D1CB;background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 14px;min-height:44px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn2:hover{border-color:var(--accent);color:var(--accent)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main{max-width:1360px;margin:0 auto;padding:24px 24px 56px;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.crumbs{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.crumbs a{color:var(--accent)}
h1{font-size:28px;font-weight:700}
h2{font-size:18px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.src{display:inline-block;font-size:11px;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 8px;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--line)}
.kpi.warn{border-top-color:#D9963A}.kpi.crit{border-top-color:var(--crit)}.kpi.good{border-top-color:var(--accent)}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:32px;font-weight:700;line-height:1.1}
.kpi .n{font-size:12px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:22px}
.grow{flex:999 1 560px}.side{flex:1 1 360px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:right;font-size:12px;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--soft);white-space:nowrap}
td.wrap{white-space:normal;min-width:260px}
.lnk{background:none;border:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 0;min-height:40px;text-align:right}
a.lnk{display:inline-block}
.w{color:var(--warn);font-weight:600}.c{color:var(--crit);font-weight:600}.g{color:var(--good);font-weight:600}
.alert{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border-radius:10px}
.alert.warn{background:var(--warn-soft)}.alert.crit{background:var(--crit-soft)}.alert.good{background:var(--accent-soft)}
.alert .big{flex:none;min-width:46px;text-align:center;font-size:22px;font-weight:700}
.alert.warn .big{color:var(--warn)}.alert.crit .big{color:var(--crit)}.alert.good .big{color:var(--accent)}
.alert p{margin:0;font-size:13px;color:var(--muted)}
.alert strong{display:block;font-size:15px}
.meter{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.hbar{display:grid;grid-template-columns:160px minmax(0,1fr) 130px;gap:12px;align-items:center;font-size:14px}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--soft)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.list-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--soft);font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid #C6D1CB;background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 15px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.pill[aria-pressed="true"],.pill[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:#fff}
.req{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:13px 22px;border-top:1px solid var(--soft)}
.dot{flex:none;width:10px;height:10px;border-radius:50%}
.req .t{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:2px}
.req .t b{font-size:15px}
.req .t small{font-size:13px;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.member-card{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px}
.avatar{width:68px;height:68px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;flex:none}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;min-width:300px}
.mini div{border-radius:10px;padding:10px 14px;background:var(--soft)}
.mini small{display:block;font-size:12px;color:var(--muted)}
.mini b{font-size:22px}
select.sel{border:1px solid #C6D1CB;border-radius:8px;padding:9px 12px;min-height:44px;background:var(--surface);max-width:100%}
.err{background:var(--crit-soft);color:var(--crit);border-radius:10px;padding:12px 16px;font-weight:600}
.drop{outline:3px dashed var(--accent);outline-offset:-10px}
.foot{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .pill{font-size:14px;min-height:40px;padding:7px 13px}
.ai-log{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow-y:auto;padding:4px 2px}
.msg{max-width:86%;border-radius:14px;padding:11px 15px;font-size:15px;line-height:1.7}
.msg.user{align-self:flex-start;background:var(--accent-soft);color:var(--ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-end;background:var(--soft);border-bottom-left-radius:4px}
.msg ul{margin:6px 0 0;padding-right:20px}
.msg .meta{display:block;font-size:12px;color:var(--muted);margin-top:6px}
.ai-form{display:flex;gap:10px;flex-wrap:wrap}
.ai-form input{flex:1 1 280px;border:1px solid #C6D1CB;border-radius:8px;padding:10px 14px;min-height:44px;background:var(--surface);color:var(--ink)}
.ai-mode{font-size:12px;border-radius:999px;padding:3px 10px;font-weight:600;background:var(--soft);color:var(--muted)}
.ai-mode.live{background:var(--accent-soft);color:var(--accent-ink)}
tr.tot td{background:var(--accent-soft);font-weight:700}
.half{flex:1 1 520px}
.kpis.k4{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
@media (max-width:520px){.hbar{grid-template-columns:100px minmax(0,1fr) 70px}.mini{min-width:0;width:100%}h1{font-size:23px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
            <div><b>المنصة الموحدة للكليات</b><span>نموذج تجريبي غير رسمي · لأغراض العرض</span></div>
    </div>
    <nav class="levels" aria-label="مستوى العرض">
      <a id="nav-uni" href="#uni">لوحة الجامعة</a>
      <a id="nav-college" href="#college-0">لوحة الكلية</a>
      <a id="nav-dept" href="#dept-0">لوحة القسم</a>
      <a id="nav-member" href="#member-0">صفحة العضو</a>
    </nav>
  </div>
</header>
<div class="bar">
  <div class="bar-in">
    <p class="src-state" id="srcState" role="status"></p>
    <label class="btn" for="file">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M12 18v-6"/><path d="M9 15l3-3 3 3"/></svg>
      افتح ملف Excel
    </label>
    <input class="vh" type="file" id="file" accept=".xlsx,.xls">
    <button class="btn2" id="sampleBtn" type="button">عرض البيانات التوضيحية</button>
    <a class="btn2" href="template/platform-data-template.xlsx" download>تنزيل القالب الفارغ</a>
  </div>
</div>
<main id="app"></main>

<script src="vendor/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
const TODAY = new Date();
const DAY = 86400000;
const SYS_URL = {
  'مكافآت التميز':'https://itcsvc.kku.edu.sa/KKU_ExcellenceRewards',
  'الترقيات':'https://itcsvc.kku.edu.sa/KKU_InstructorsPromotions',
  'حضور مؤتمر':'https://itcsvc.kku.edu.sa/KKU_ConferenceAttendance',
  'الخدمة الذاتية':'https://ess.kku.edu.sa',
  'أكاديميا':'https://registration.kku.edu.sa/kku/ui/login/studentSSOLogin.faces',
  'الملف الأكاديمي':'https://itcsvc.kku.edu.sa/KKU_AcademicProfile',
  'أعذار الطلاب':'https://itcsvc.kku.edu.sa/KKU_StudentsExcuses'
};
const STAGES = ['دبلوم', 'بكالوريوس', 'ماجستير', 'دكتوراه'];
const S = { model:null, source:'sample', fileName:'', reqF:'all', error:'', chat:{ key:'', msgs:[] }, busy:false, last:{ college:0, dept:0, member:0 } };
let SAMPLE = null;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const str = v => (v == null ? '' : String(v)).trim();
const num = v => { const n = typeof v === 'number' ? v : parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const toDate = v => {
  if (v instanceof Date && !isNaN(v)) return new Date(Math.round(v.getTime() / DAY) * DAY);
  if (typeof v === 'number' && v > 20000) return new Date(Math.round(v - 25569) * DAY);
  if (typeof v === 'string' && v.trim()) { const d = new Date(v.trim()); return isNaN(d) ? null : d; }
  return null;
};
const timeKey = v => {
  if (v instanceof Date && !isNaN(v)) return String(v.getHours()).padStart(2, '0') + ':' + String(v.getMinutes()).padStart(2, '0');
  if (typeof v === 'number' && v >= 0 && v < 1) { const m = Math.round(v * 1440); return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
  return str(v);
};
const fdate = d => d ? d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0') : '';
const days = (a, b) => Math.max(0, Math.round((b - a) / DAY));
const f1 = n => n == null || !isFinite(n) ? '—' : n.toFixed(1);
const f2 = n => n == null || !isFinite(n) ? '—' : n.toFixed(2);
const fmt = n => n == null ? '—' : Number(n).toLocaleString('en-US');
const pc = n => n == null || !isFinite(n) ? '—' : Math.round(n * 100) + '%';
const pct = (n, max) => max > 0 ? Math.max(0, Math.min(100, Math.round(n / max * 100))) : 0;
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const sumOf = (a, k) => a.reduce((s, x) => s + (x[k] || 0), 0);

/* ---------- قراءة القالب ---------- */
function rowsOf(wb, name){ const ws = wb.Sheets[name]; return ws ? XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true}) : null; }
function mapRows(rows, spec, keyField){
  if (!rows || !rows.length) return [];
  const head = rows[0].map(h => str(h));
  const idx = {};
  for (const k in spec) idx[k] = head.findIndex(h => h === spec[k] || h.indexOf(spec[k]) === 0);
  return rows.slice(1).map(r => { const o = {}; for (const k in idx) o[k] = idx[k] >= 0 ? r[idx[k]] : ''; return o; })
             .filter(o => str(o[keyField]) !== '');
}
function fromWorkbook(wb){
  for (const n of ['الأعضاء','الأقسام']) if (!wb.Sheets[n]) throw new Error('الملف لا يطابق القالب: لم أجد ورقة «' + n + '». استخدم قالب بيانات المنصة الموحدة.');
  const st = rowsOf(wb, 'الإعدادات') || [];
  const sv = i => num(st[i] && st[i][1]);
  const set = { year: sv(1) || TODAY.getFullYear(), load: sv(2) || 14, reqSla: sv(3) || 14, cmpSla: sv(4) || 5, promo: sv(5) || 4, minSec: sv(6) || 10 };
  const raw = {
    set,
    depts: mapRows(rowsOf(wb,'الأقسام'), {college:'الكلية', name:'القسم', students:'عدد الطلاب', sections:'الشعب', atRisk:'طلاب في خطر'}, 'name'),
    fac: mapRows(rowsOf(wb,'الأعضاء'), {id:'الرقم الوظيفي', name:'الاسم', dept:'القسم', rank:'الرتبة', rankDate:'تاريخ التعيين', status:'الحالة', load:'العبء التدريسي', claimed:'طلب مكافأة الوحدات'}, 'id'),
    res: mapRows(rowsOf(wb,'الأبحاث'), {id:'الرقم الوظيفي', title:'عنوان البحث', doi:'DOI', venue:'المجلة', year:'سنة النشر', q:'الربعية', index:'قاعدة الفهرسة', units:'الوحدات المحتسبة', reward:'حالة المكافأة'}, 'id'),
    req: mapRows(rowsOf(wb,'الطلبات'), {no:'رقم الطلب', id:'الرقم الوظيفي', sys:'النظام المصدر', type:'نوع الطلب', date:'تاريخ التقديم', stage:'المرحلة الحالية', status:'الحالة', updated:'تاريخ آخر تحديث'}, 'no'),
    cmp: mapRows(rowsOf(wb,'الشكاوى'), {no:'رقم البلاغ', dept:'القسم', type:'النوع', channel:'قناة الورود', date:'تاريخ الورود', closed:'تاريخ الإغلاق', status:'الحالة'}, 'no'),
    stu: mapRows(rowsOf(wb,'الطلاب'), {dept:'القسم', stage:'المرحلة الدراسية', level:'المستوى', count:'عدد الطلاب', atRisk:'في خطر', grads:'متوقع تخرجهم'}, 'dept'),
    sec: mapRows(rowsOf(wb,'الجداول'), {code:'رمز المقرر', course:'اسم المقرر', sec:'الشعبة', dept:'القسم', inst:'الرقم الوظيفي', day:'اليوم', time:'الوقت', room:'القاعة', cap:'السعة', enrolled:'المسجلون'}, 'code'),
    cou: mapRows(rowsOf(wb,'المجالس'), {council:'المجلس', body:'الجهة', date:'تاريخ الجلسة', items:'عدد البنود', done:'البنود المعتمدة', deferred:'البنود المؤجلة', minutes:'المحضر معتمد'}, 'council')
  };
  if (!raw.fac.length) throw new Error('ورقة «الأعضاء» فارغة. أضف عضواً واحداً على الأقل ثم أعد فتح الملف.');
  return raw;
}

/* ---------- الحساب ---------- */
function summarize(X, D, C){
  const set = X.set, inD = d => D.has(d);
  const F = X.fac.filter(f => inD(f.dept)), A = F.filter(f => f.active);
  const R = X.res.filter(r => inD(r.dept) && r.year === set.year);
  const Q = X.req.filter(q => inD(q.dept)), Cm = X.cmp.filter(c => inD(c.dept));
  const ST = X.stu.filter(x => inD(x.dept)), SE = X.sec.filter(x => inD(x.dept));
  const CO = X.cou.filter(c => inD(c.body) || C.has(c.body));
  const DM = X.deptRows.filter(d => inD(d.name));
  const loads = A.map(f => f.load).filter(x => x != null);
  const stages = {}; ST.forEach(x => { stages[x.stage] = (stages[x.stage] || 0) + x.count; });
  const withCap = SE.filter(x => x.cap != null);
  const capSum = sumOf(withCap, 'cap'), enr = sumOf(withCap, 'enrolled');
  const lastC = CO.reduce((m, c) => c.date && (!m || c.date > m) ? c.date : m, null);
  const o = {
    all:F.length, fac:A.length,
    students: ST.length ? sumOf(ST, 'count') : sumOf(DM, 'students'),
    atRisk: ST.length ? sumOf(ST, 'atRisk') : sumOf(DM, 'atRisk'),
    grads: sumOf(ST, 'grads'), stages,
    avgLoad:avg(loads), maxLoad:loads.length ? Math.max.apply(null, loads) : null, minLoad:loads.length ? Math.min.apply(null, loads) : null,
    overUnclaimed:F.filter(f => f.overUnclaimed).length, promoReady:F.filter(f => f.promoReady).length, profileOk:F.filter(f => f.profileOk).length,
    pubs:R.length, q1:R.filter(r => r.q === 'Q1').length, q2:R.filter(r => r.q === 'Q2').length,
    openReq:Q.filter(q => q.open).length, overdueReq:Q.filter(q => q.overdue).length,
    openCmp:Cm.filter(c => c.open).length, overdueCmp:Cm.filter(c => c.overdue).length,
    sections: SE.length || sumOf(DM, 'sections'), secFill: capSum ? enr / capSum : null,
    secIssues:SE.filter(x => x.issue).length, secOver:SE.filter(x => x.over).length, secLow:SE.filter(x => x.low).length,
    secNoInst:SE.filter(x => x.noInst).length, secClash:SE.filter(x => x.roomClash || x.instClash).length,
    meetings:CO.filter(c => c.date && days(c.date, TODAY) <= 120).length, meetingsAll:CO.length,
    pendingItems:sumOf(CO, 'pending'), minutesPending:CO.filter(c => !c.minutes).length, lastMeeting:lastC,
    members:F, requests:Q, complaints:Cm, secList:SE, couList:CO, stuList:ST
  };
  o.ratio = o.fac && o.students ? o.students / o.fac : null;
  o.perFac = o.fac ? o.pubs / o.fac : null;
  o.profilePct = F.length ? o.profileOk / F.length : null;
  o.sinceMeeting = lastC ? days(lastC, TODAY) : null;
  o.score = o.overdueReq + o.overdueCmp + o.secIssues + o.minutesPending + o.overUnclaimed;
  return o;
}
function build(raw){
  const set = raw.set;
  const deptRows = raw.depts.map(d => ({ name:str(d.name), college:str(d.college) || 'كلية غير محددة', students:num(d.students), sections:num(d.sections), atRisk:num(d.atRisk) }));
  const fac = raw.fac.map(f => ({ id:str(f.id), name:str(f.name) || str(f.id), dept:str(f.dept), rank:str(f.rank), rankDate:toDate(f.rankDate), status:str(f.status) || 'على رأس العمل', load:num(f.load), claimed:str(f.claimed) === 'نعم' }));
  const known = new Set(deptRows.map(d => d.name));
  fac.forEach(f => { if (f.dept && !known.has(f.dept)) { known.add(f.dept); deptRows.push({ name:f.dept, college:'كلية غير محددة', students:null, sections:null, atRisk:null }); } });
  const colOf = new Map(deptRows.map(d => [d.name, d.college]));
  const byId = new Map(fac.map(f => [f.id, f]));
  fac.forEach(f => { f.college = colOf.get(f.dept) || 'كلية غير محددة'; });
  const res = raw.res.map(r => ({ id:str(r.id), title:str(r.title), doi:str(r.doi), venue:str(r.venue), year:num(r.year), q:str(r.q), index:str(r.index), units:num(r.units) || 0, reward:str(r.reward) }));
  res.forEach(r => { r.dept = (byId.get(r.id) || {}).dept || ''; });
  const req = raw.req.map(q => {
    const o = { no:str(q.no), id:str(q.id), sys:str(q.sys), type:str(q.type), date:toDate(q.date), stage:str(q.stage), status:str(q.status), updated:toDate(q.updated) };
    o.dept = (byId.get(o.id) || {}).dept || '';
    o.open = o.status === 'جديد' || o.status === 'قيد الاعتماد';
    const closed = o.status === 'معتمد' || o.status === 'مرفوض';
    o.wait = o.date ? (closed ? (o.updated ? days(o.date, o.updated) : null) : days(o.date, TODAY)) : null;
    o.overdue = o.open && o.wait != null && o.wait > set.reqSla;
    o.k = o.status === 'مرفوض' ? 'act' : (o.open ? 'wait' : 'done');
    return o;
  });
  const cmp = raw.cmp.map(c => {
    const o = { no:str(c.no), dept:str(c.dept), type:str(c.type) || 'أخرى', channel:str(c.channel), date:toDate(c.date), closed:toDate(c.closed), status:str(c.status) || 'مفتوحة' };
    o.open = o.status !== 'مغلقة';
    o.days = o.date ? days(o.date, o.closed || TODAY) : null;
    o.overdue = o.open && o.days != null && o.days > set.cmpSla;
    return o;
  });
  const stu = raw.stu.map(x => ({ dept:str(x.dept), stage:str(x.stage) || 'بكالوريوس', level:str(x.level), count:num(x.count) || 0, atRisk:num(x.atRisk) || 0, grads:num(x.grads) || 0 }));
  const sec = raw.sec.map(x => ({ code:str(x.code), course:str(x.course), sec:str(x.sec), dept:str(x.dept), inst:str(x.inst), day:str(x.day), time:timeKey(x.time), room:str(x.room), cap:num(x.cap), enrolled:num(x.enrolled) || 0 }));
  const k1 = {}, k2 = {};
  sec.forEach(x => {
    if (x.room && x.day && x.time) { const k = x.room + '|' + x.day + '|' + x.time; k1[k] = (k1[k] || 0) + 1; }
    if (x.inst && x.day && x.time) { const k = x.inst + '|' + x.day + '|' + x.time; k2[k] = (k2[k] || 0) + 1; }
  });
  sec.forEach(x => {
    x.noInst = !x.inst; x.over = x.cap != null && x.enrolled > x.cap; x.low = x.enrolled < set.minSec;
    x.roomClash = !!(x.room && x.day && x.time && k1[x.room + '|' + x.day + '|' + x.time] > 1);
    x.instClash = !!(x.inst && x.day && x.time && k2[x.inst + '|' + x.day + '|' + x.time] > 1);
    x.issue = x.noInst ? 'بلا محاضر' : x.roomClash ? 'تعارض في القاعة' : x.instClash ? 'تعارض للمحاضر' : x.over ? 'فوق السعة' : x.low ? 'دون الحد الأدنى' : '';
    x.instName = x.inst ? ((byId.get(x.inst) || {}).name || x.inst) : '—';
  });
  const collegeNames = []; deptRows.forEach(d => { if (collegeNames.indexOf(d.college) < 0) collegeNames.push(d.college); });
  const cou = raw.cou.map(x => ({ council:str(x.council), body:str(x.body), date:toDate(x.date), items:num(x.items) || 0, done:num(x.done) || 0, deferred:num(x.deferred) || 0, minutes:str(x.minutes) === 'نعم' }));
  cou.forEach(c => { c.pending = Math.max(0, c.items - c.done); c.college = known.has(c.body) ? colOf.get(c.body) : (collegeNames.indexOf(c.body) >= 0 ? c.body : ''); });
  fac.forEach(f => {
    f.over = f.load != null ? Math.max(0, f.load - set.load) : 0;
    f.yrs = f.rankDate ? (TODAY - f.rankDate) / (365.25 * DAY) : null;
    f.res = res.filter(r => r.id === f.id);
    f.pubsY = f.res.filter(r => r.year === set.year).length;
    f.units = f.res.reduce((a, r) => a + r.units, 0);
    f.reqs = req.filter(q => q.id === f.id);
    f.secs = sec.filter(x => x.inst === f.id);
    f.openReqs = f.reqs.filter(q => q.open).length;
    f.active = f.status === 'على رأس العمل';
    f.overUnclaimed = f.active && f.over > 0 && !f.claimed;
    f.promoReady = f.active && f.rank !== 'أستاذ' && f.rank !== '' && f.yrs != null && f.yrs >= set.promo;
    f.missing = [];
    if (!f.rankDate) f.missing.push('تاريخ التعيين');
    if (f.active && f.load == null) f.missing.push('العبء');
    if (!f.res.length) f.missing.push('الأبحاث');
    f.profileOk = f.missing.length === 0;
    f.flags = [];
    if (f.overUnclaimed) f.flags.push('عبء زائد دون مطالبة');
    if (f.promoReady) f.flags.push('راجع أهلية الترقية');
    if (f.reqs.some(q => q.status === 'مرفوض')) f.flags.push('طلب مرفوض');
    if (f.secs.some(x => x.instClash)) f.flags.push('تعارض في الجدول');
  });
  cmp.forEach(c => { c.college = colOf.get(c.dept) || ''; });
  const X = { set, fac, res, req, cmp, stu, sec, cou, deptRows };
  const dept = deptRows.map(d => Object.assign({ name:d.name, college:d.college, meta:d }, summarize(X, new Set([d.name]), new Set())));
  const colleges = collegeNames.map(n => {
    const ds = dept.map((d, i) => d.college === n ? i : -1).filter(i => i >= 0);
    return Object.assign({ name:n, deptIdx:ds }, summarize(X, new Set(ds.map(i => dept[i].name)), new Set([n])));
  });
  const uni = summarize(X, new Set(dept.map(d => d.name)), new Set(collegeNames));
  const members = fac.slice().sort((a, b) => (a.college + a.dept + a.name).localeCompare(b.college + b.dept + b.name, 'ar'));
  return { set, fac, members, res, req, cmp, stu, sec, cou, dept, colleges, uni };
}

/* ---------- بيانات توضيحية ---------- */
function sampleRaw(){
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const Y = TODAY.getFullYear();
  const C = [
    ['كلية علوم الحاسب', [['علوم الحاسب',1320,14,'CS'],['هندسة الحاسب',910,11,'CE'],['نظم المعلومات',840,10,'IS'],['الشبكات والاتصالات',560,8,'NT']]],
    ['كلية الهندسة', [['الهندسة المدنية',980,12,'CIV'],['الهندسة الكهربائية',870,11,'EE'],['الهندسة الميكانيكية',760,10,'ME']]],
    ['كلية العلوم', [['الرياضيات',640,10,'MATH'],['الفيزياء',520,9,'PHYS'],['الكيمياء',590,9,'CHEM']]]
  ];
  const depts = [], fac = [], res = [], req = [], cmp = [], stu = [], sec = [], cou = [];
  const ranks = ['أستاذ','أستاذ مشارك','أستاذ مساعد','أستاذ مساعد','أستاذ مساعد','محاضر'];
  const T = { 'مكافآت التميز':'مكافأة نشر علمي', 'الترقيات':'طلب ترقية', 'حضور مؤتمر':'حضور مؤتمر', 'الخدمة الذاتية':'إجازة أو انتداب', 'أكاديميا':'تعديل درجة', 'الملف الأكاديمي':'تحديث المؤهلات' };
  const dayN = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'], times = ['08:00','10:00','12:00','14:00'];
  let n = 1;
  C.forEach(([col, ds]) => {
    for (let k = 0; k < ri(2, 4); k++) {
      const items = ri(5, 14), done = Math.max(0, items - ri(0, 4));
      cou.push({ council:'مجلس الكلية', body:col, date:new Date(TODAY - ri(5, 140) * DAY), items, done, deferred:items - done, minutes:k === 0 && rnd() < 0.6 ? 'لا' : 'نعم' });
    }
    ds.forEach(([d, students, nf, pre]) => {
      depts.push({ college:col, name:d, students, sections:'', atRisk:'' });
      const ids = [];
      for (let i = 0; i < nf; i++) {
        const rank = pick(ranks), status = rnd() < 0.12 ? pick(['ابتعاث','إجازة']) : 'على رأس العمل';
        const id = 'S' + String(n).padStart(3, '0'); ids.push(status === 'على رأس العمل' ? id : null);
        fac.push({ id, name:'عضو تجريبي ' + String(n).padStart(3, '0'), dept:d, rank, status, load:status === 'على رأس العمل' ? ri(8, 18) : '',
          rankDate:rnd() < 0.1 ? '' : new Date(Y - 1 - ri(0, 7), ri(0, 11), ri(1, 27)), claimed:rnd() < 0.35 ? 'نعم' : 'لا' });
        const kr = rank === 'محاضر' ? ri(0, 1) : ri(0, 4);
        for (let j = 0; j < kr; j++) res.push({ id, title:'بحث توضيحي ' + (res.length + 1), venue:'[المجلة]', year:Y - ri(0, 2), q:pick(['Q1','Q1','Q2','Q2','Q3','Q4']), index:pick(['Scopus','كلاهما']), units:0.5, reward:pick(['لم يُقدَّم','معتمد','قيد الاعتماد']) });
        n++;
      }
      const act = ids.filter(Boolean);
      const bach = Math.round(students * 0.93), per = Math.round(bach / 8);
      for (let lv = 1; lv <= 8; lv++) stu.push({ dept:d, stage:'بكالوريوس', level:'المستوى ' + lv, count:per + ri(-15, 15), atRisk:ri(1, Math.max(2, Math.round(per * 0.05))), grads:lv === 8 ? Math.round(per * 0.8) : 0 });
      if (rnd() < 0.7) stu.push({ dept:d, stage:'ماجستير', level:'السنة 1-2', count:ri(25, 60), atRisk:ri(0, 4), grads:ri(5, 15) });
      if (rnd() < 0.4) stu.push({ dept:d, stage:'دكتوراه', level:'السنة 1-4', count:ri(6, 20), atRisk:ri(0, 2), grads:ri(0, 4) });
      const rooms = ['A', 'B', 'C', 'D', 'E'].map(r => pre + '-' + r + ri(1, 2));
      for (let i = 0; i < Math.round(nf * 1.4); i++) {
        const cap = pick([30, 35, 40, 45, 50]);
        sec.push({ code:pre + ' ' + ri(101, 499), course:'مقرر ' + pre + ' ' + (i + 1), sec:String(ri(1, 3)), dept:d, inst:rnd() < 0.05 ? '' : pick(act) || '', day:pick(dayN), time:pick(times), room:pick(rooms), cap, enrolled:rnd() < 0.08 ? ri(3, 9) : ri(Math.round(cap * 0.5), cap + 4) });
      }
      for (let k = 0; k < ri(3, 5); k++) {
        const items = ri(6, 15), done = Math.max(0, items - ri(0, 4));
        cou.push({ council:'مجلس القسم', body:d, date:new Date(TODAY - ri(3, 150) * DAY), items, done, deferred:items - done, minutes:k === 0 && rnd() < 0.5 ? 'لا' : 'نعم' });
      }
      for (let k = 0; k < ri(1, 5); k++) {
        const st = pick(['مفتوحة','قيد المعالجة','مغلقة','مغلقة']), date = new Date(TODAY - ri(1, 25) * DAY);
        cmp.push({ no:'C-' + String(cmp.length + 1).padStart(4, '0'), dept:d, type:pick(['الجداول والاختبارات','رصد الدرجات','التسجيل','المرافق والقاعات','التعامل مع عضو هيئة التدريس']), channel:pick(['باعث مستفيد','لقاء','مباشر']), date, closed:st === 'مغلقة' ? new Date(+date + ri(1, 7) * DAY) : '', status:st });
      }
    });
  });
  for (let i = 0; i < 260; i++) {
    const f = pick(fac), sys = pick(Object.keys(T)), status = pick(['جديد','قيد الاعتماد','قيد الاعتماد','معتمد','مرفوض']);
    const date = new Date(TODAY - ri(2, 60) * DAY);
    req.push({ no:String(14000 + i), id:f.id, sys, type:T[sys], date, stage:status === 'معتمد' ? 'منتهٍ' : pick(['مجلس القسم','مجلس القسم','مجلس الكلية','المجلس العلمي']), status,
      updated:status === 'معتمد' || status === 'مرفوض' ? new Date(+date + ri(3, 22) * DAY) : '' });
  }
  return { set:{ year:Y, load:14, reqSla:14, cmpSla:5, promo:4, minSec:10 }, depts, fac, res, req, cmp, stu, sec, cou };
}

/* ---------- أجزاء العرض ---------- */
const kpi = (l, v, n, tone, src) => `<div class="kpi ${tone || ''}"><span class="l">${esc(l)}</span><span class="v num">${v}</span><span class="n">${n}</span><span class="src" style="align-self:flex-start">${esc(src)}</span></div>`;
const alertBox = (n, t, p, tone) => `<div class="alert ${tone}"><span class="big num">${n}</span><div><strong>${esc(t)}</strong><p>${esc(p)}</p></div></div>`;
const vsCol = (v, c, higherBetter) => v == null || c == null ? '' : ((higherBetter ? v >= c : v <= c) ? 'g' : 'w');
const lateTag = (n, word) => n ? ` <span class="c">(${n} ${word})</span>` : '';
const card = (id, title, src, inner, cls) => `<section class="card ${cls || ''}" aria-labelledby="${id}"><div class="card-h"><h2 id="${id}">${title}</h2>${src ? `<span class="src">${esc(src)}</span>` : ''}</div>${inner}</section>`;
const table = (head, rows, minW) => `<div class="tbl-wrap"><table style="min-width:${minW || 720}px"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
const totalRow = cells => `<tr class="tot">${cells.map(c => `<td class="num">${c}</td>`).join('')}</tr>`;

function stagesTable(units, nameCell){
  const rows = units.map(u => `<tr><td>${nameCell(u)}</td>${STAGES.map(s => `<td class="num">${u.stages[s] ? fmt(u.stages[s]) : '—'}</td>`).join('')}<td class="num"><b>${fmt(u.students)}</b></td><td class="num ${u.atRisk ? 'w' : ''}">${fmt(u.atRisk)}</td><td class="num">${fmt(u.grads)}</td></tr>`).join('');
  return table(['الجهة'].concat(STAGES, ['الإجمالي', 'في خطر أكاديمي', 'متوقع تخرجهم']), rows, 760);
}
function scheduleTable(units, nameCell){
  const rows = units.map(u => `<tr><td>${nameCell(u)}</td><td class="num">${fmt(u.sections)}</td><td class="num">${pc(u.secFill)}</td><td class="num ${u.secOver ? 'w' : ''}">${u.secOver}</td><td class="num ${u.secLow ? 'w' : ''}">${u.secLow}</td><td class="num ${u.secNoInst ? 'c' : ''}">${u.secNoInst}</td><td class="num ${u.secClash ? 'c' : ''}">${u.secClash}</td></tr>`).join('');
  return table(['الجهة', 'الشعب', 'نسبة الامتلاء', 'فوق السعة', 'دون الحد الأدنى', 'بلا محاضر', 'تعارضات'], rows, 720);
}
function councilTable(units, nameCell){
  const rows = units.map(u => `<tr><td>${nameCell(u)}</td><td class="num">${u.meetings}</td><td class="num ${u.sinceMeeting != null && u.sinceMeeting > 45 ? 'w' : ''}">${u.sinceMeeting == null ? '—' : u.sinceMeeting + ' يوماً'}</td><td class="num ${u.pendingItems ? 'w' : ''}">${u.pendingItems}</td><td class="num ${u.minutesPending ? 'c' : ''}">${u.minutesPending}</td></tr>`).join('');
  return table(['الجهة', 'جلسات آخر 120 يوماً', 'آخر جلسة منذ', 'بنود لم تُعتمد', 'محاضر غير معتمدة'], rows, 520);
}
function researchBars(units){
  const max = Math.max(1, ...units.map(u => u.pubs));
  return units.map(u => `<div class="hbar"><span>${esc(u.name)}</span><div class="stack" role="img" aria-label="${esc(u.name)}: ${u.q1} في Q1 و ${u.q2} في Q2 و ${u.pubs - u.q1 - u.q2} أخرى"><i style="width:${pct(u.q1, max)}%;background:#0F6B4F"></i><i style="width:${pct(u.q2, max)}%;background:#5FA88B"></i><i style="width:${pct(u.pubs - u.q1 - u.q2, max)}%;background:#B9D7C9"></i></div><span class="num">${u.pubs} · ${f2(u.perFac)}/عضو</span></div>`).join('')
    + '<div class="legend"><span><i style="background:#0F6B4F"></i>Q1</span><span><i style="background:#5FA88B"></i>Q2</span><span><i style="background:#B9D7C9"></i>Q3، Q4 وغير مصنفة</span></div>';
}
function complaintTypes(list, cmpSla){
  const types = {}; list.filter(x => x.open).forEach(x => { const t = types[x.type] || (types[x.type] = {n:0, o:0}); t.n++; if (x.overdue) t.o++; });
  const tl = Object.entries(types).sort((a, b) => b[1].n - a[1].n);
  const closedDays = avg(list.filter(x => !x.open && x.days != null).map(x => x.days));
  return (tl.length ? tl.map(([t, v]) => `<div class="list-row"><span>${esc(t)}</span><span class="num">${v.n} مفتوحة${v.o ? ` · <span class="c">${v.o} متأخرة</span>` : ''}</span></div>`).join('') : '<p class="empty">لا توجد شكاوى مفتوحة.</p>')
    + `<p class="foot">متوسط زمن المعالجة للمغلقة: <b>${closedDays == null ? '—' : f1(closedDays) + ' يوم'}</b> · المهلة ${cmpSla} أيام</p>`;
}
function stagePipeline(reqs){
  const stages = ['مجلس القسم','مجلس الكلية','المجلس العلمي','الموارد البشرية'].map(st => {
    const Q = reqs.filter(q => q.open && q.stage === st); return { st, n:Q.length, w:avg(Q.map(q => q.wait).filter(x => x != null)) };
  }).filter(x => x.n);
  const max = Math.max(1, ...stages.map(x => x.n));
  return stages.length ? stages.map(x => `<div><div class="list-row" style="border:0;padding:4px 0"><b>${esc(x.st)}</b><span class="num">${x.n} طلباً · متوسط ${x.w == null ? '—' : Math.round(x.w)} يوماً</span></div><div class="meter"><i style="width:${pct(x.n, max)}%"></i></div></div>`).join('') : '<p class="empty">لا توجد طلبات معلّقة.</p>';
}
function issueSections(list, limit){
  const L = list.filter(x => x.issue).sort((a, b) => (a.issue > b.issue ? 1 : -1)).slice(0, limit || 12);
  if (!L.length) return '<p class="empty">لا توجد شعب بها مشكلة.</p>';
  return table(['المقرر', 'الشعبة', 'المحاضر', 'الموعد', 'القاعة', 'المسجلون/السعة', 'المشكلة'],
    L.map(x => `<tr><td>${esc(x.code)} · ${esc(x.course)}</td><td class="num">${esc(x.sec)}</td><td>${esc(x.instName)}</td><td>${esc(x.day)} <bdi dir="ltr">${esc(x.time)}</bdi></td><td><bdi dir="ltr">${esc(x.room)}</bdi></td><td class="num">${x.enrolled}/${x.cap == null ? '—' : x.cap}</td><td class="${/تعارض|بلا/.test(x.issue) ? 'c' : 'w'}">${esc(x.issue)}</td></tr>`).join(''), 760);
}
function meetingsList(list, limit){
  const L = list.slice().sort((a, b) => (b.date || 0) - (a.date || 0)).slice(0, limit || 8);
  if (!L.length) return '<p class="empty">لا توجد جلسات مسجلة.</p>';
  return table(['المجلس', 'الجهة', 'التاريخ', 'البنود', 'لم تُعتمد', 'المحضر'],
    L.map(c => `<tr><td>${esc(c.council)}</td><td>${esc(c.body)}</td><td><bdi dir="ltr">${fdate(c.date)}</bdi></td><td class="num">${c.items}</td><td class="num ${c.pending ? 'w' : ''}">${c.pending}</td><td class="${c.minutes ? 'g' : 'c'}">${c.minutes ? 'معتمد' : 'غير معتمد'}</td></tr>`).join(''), 640);
}

/* ---------- لوحة الجامعة ---------- */
function viewUniversity(M){
  const u = M.uni, s = M.set;
  const link = (i, name) => `<a class="lnk" href="#college-${i}">${esc(name)}</a>`;
  const cols = M.colleges.map((c, i) => Object.assign({ i }, c));

  const tasks = [];

function fmtClaude(text){

  lines.forEach(l => {
    const m = /^\s*(?:[-•*]|\d+[.)])\s+(.*)/.exec(l);

  });
  return html + (inList ? '</ul>' : '');
}

  const instr = 'أنت مساعد عضو هيئة التدريس في «المنصة الموحدة للكليات». أجب بالعربية الفصحى المبسطة، في جمل قصيرة أو نقاط، من بيانات العضو المرفقة فقط. اذكر الأرقام واسم النظام المصدر عند الحاجة. إن لم تكفِ البيانات للإجابة فقل ذلك صراحة واقترح أين يجدها (مثل فتح الطلب في نظامه). لا تخترع لوائح أو أرقاماً أو أسباب رفض غير موجودة في البيانات. لا تتجاوز 120 كلمة.';
  const messages = prior.concat([{ role:'user', content: instr + '\n\nبيانات العضو:\n' + JSON.stringify(memberCtx(f, M)) + '\n\nالسؤال: ' + q }]);
  const res = await SAMPLE(messages, { cache:false, modelTier:'quick', onText: ({text}) => { bubble.innerHTML = fmtClaude(text); } });
  return res.text || '';
}
function renderChat(){
  const log = document.getElementById('aiLog'); if (!log) return;
  log.innerHTML = S.chat.msgs.length ? S.chat.msgs.map(m => `<div class="msg ${m.role === 'user' ? 'user' : 'bot'}">${m.html}${m.meta ? `<span class="meta">${esc(m.meta)}</span>` : ''}</div>`).join('')
    : '<p class="foot" style="margin:0">اختر سؤالاً مقترحاً أو اكتب سؤالك. يجيب المساعد من بيانات العضو المعروض فقط.</p>';
  log.scrollTop = log.scrollHeight;
  const mode = document.getElementById('aiMode'), note = document.getElementById('aiNote');
  if (mode) { mode.textContent = SAMPLE ? 'مدعوم بالذكاء الاصطناعي (Claude)' : 'يعمل داخل متصفحك'; mode.className = 'ai-mode' + (SAMPLE ? ' live' : ''); }
  if (note) note.textContent = SAMPLE
    ? 'في هذه النسخة التجريبية تُرسل بيانات العضو المعروض إلى Claude لصياغة الإجابة. استخدمها ببيانات توضيحية أو ببياناتك أنت فقط.'
    : 'نسخة تجريبية تجيب بقواعد محددة، ولا تُرسل بياناتك لأي جهة. النسخة الرسمية تستخدم نموذج لغة مستضافاً داخل المملكة.';
}
async function sendQ(q, i){
  const M = S.model, f = M && M.members[i]; q = (q || '').trim();
  if (!f || !q || S.busy) return;
  S.chat.msgs.push({ role:'user', html:esc(q), text:q });
  const bot = { role:'assistant', html:'<span class="foot">جارٍ التفكير…</span>', text:'' };
  S.chat.msgs.push(bot); renderChat();
  if (SAMPLE) {
    S.busy = true;
    const bubbles = document.querySelectorAll('#aiLog .msg.bot'); const bubble = bubbles[bubbles.length - 1];
    try { const text = await askClaude(q, f, M, bubble); bot.text = text; bot.html = fmtClaude(text); bot.meta = 'Claude · من بياناتك الموحدة'; }
    catch (e) {
      if (e && e.code === 'not_granted') SAMPLE = null;
      bot.html = localAnswer(q, f, M); bot.text = bot.html.replace(/<[^>]+>/g, ' ');
      bot.meta = e && e.code === 'rate_limited' ? 'تجاوزت حد الطلبات مؤقتاً؛ أجبت بالقواعد المحلية' : 'أجبت بالقواعد المحلية';
    }
    S.busy = false;
  } else {
    bot.html = localAnswer(q, f, M); bot.text = bot.html.replace(/<[^>]+>/g, ' '); bot.meta = 'من بياناتك الموحدة';
  }
  renderChat();
}
function bindAI(i){
  const key = (S.model ? S.fileName + '|' : '') + i;
  if (S.chat.key !== key) S.chat = { key, msgs:[] };
  document.querySelectorAll('#aiCard button[data-q]').forEach(b => b.addEventListener('click', () => sendQ(b.dataset.q, i)));
  const form = document.getElementById('aiForm'), inp = document.getElementById('aiInput');
  if (form) form.addEventListener('submit', e => { e.preventDefault(); const v = inp.value; inp.value = ''; sendQ(v, i); });
  renderChat();
}



/* ---------- التوجيه ---------- */
function route(){
  const M = S.model, app = document.getElementById('app');
  const h = (location.hash || '#uni').slice(1);
  const mc = /^college-(\d+)$/.exec(h), md = /^dept-(\d+)$/.exec(h), mm = /^member-(\d+)$/.exec(h);
  const level = mc ? 'college' : md ? 'dept' : mm ? 'member' : 'uni';
  if (mc) S.last.college = +mc[1];
  if (md) { S.last.dept = +md[1]; if (M && M.dept[+md[1]]) { const ci = M.colleges.findIndex(c => c.name === M.dept[+md[1]].college); if (ci >= 0) S.last.college = ci; } }
  if (mm) { S.last.member = +mm[1]; const f = M && M.members[+mm[1]]; if (f) { const di = M.dept.findIndex(d => d.name === f.dept); if (di >= 0) S.last.dept = di; const ci = M.colleges.findIndex(c => c.name === f.college); if (ci >= 0) S.last.college = ci; } }
  if (mc && M && M.colleges[+mc[1]] && M.dept[S.last.dept] && M.dept[S.last.dept].college !== M.colleges[+mc[1]].name) S.last.dept = M.colleges[+mc[1]].deptIdx[0] || 0;
  const navs = { uni:'#uni', college:'#college-' + S.last.college, dept:'#dept-' + S.last.dept, member:'#member-' + S.last.member };
  Object.keys(navs).forEach(l => { const a = document.getElementById('nav-' + l); a.setAttribute('href', navs[l]); if (l === level) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  let html = S.error ? `<p class="err" role="alert">${esc(S.error)}</p>` : '';
  if (M) html += level === 'college' ? viewCollege(M, +mc[1]) : level === 'dept' ? viewDept(M, +md[1]) : level === 'member' ? viewMember(M, +mm[1]) : viewUniversity(M);
  app.innerHTML = html;
  const sel = document.getElementById('memberSel');
  if (sel) sel.addEventListener('change', () => { S.reqF = 'all'; location.hash = 'member-' + sel.value; });
  app.querySelectorAll('button[data-f]').forEach(b => b.addEventListener('click', () => { S.reqF = b.dataset.f; route(); }));
  if (M && level === 'member') bindAI(+mm[1]);
  const st = document.getElementById('srcState');
  st.innerHTML = M ? (S.source === 'file'
    ? `<span class="tag real">بياناتك</span> الملف: <b>${esc(S.fileName)}</b> · ${M.colleges.length} كليات · ${M.dept.length} قسماً · ${M.fac.length} عضواً · ${M.sec.length} شعبة. تُقرأ داخل متصفحك فقط ولا تُرسل لأي جهة.`
    : `<span class="tag sample">بيانات توضيحية</span> ثلاث كليات افتراضية لعرض طريقة العمل. افتح قالب Excel بعد تعبئته لتظهر بياناتك؛ تُقرأ داخل متصفحك فقط.`) : 'جارٍ التحميل…';
}
function load(raw, source, name){
  try { S.model = build(raw); S.source = source; S.fileName = name || ''; S.error = ''; S.reqF = 'all'; S.last = { college:0, dept:0, member:0 }; S.chat = { key:'', msgs:[] }; }
  catch (e) { S.error = 'تعذّر حساب المؤشرات: ' + e.message; }
  route();
}
function readFile(file){
  if (!file) return;
  if (typeof XLSX === 'undefined') { S.error = 'تعذّر تحميل قارئ ملفات Excel. أعد تحميل الصفحة.'; route(); return; }
  const fr = new FileReader();
  fr.onload = e => {
    try { const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true}); load(fromWorkbook(wb), 'file', file.name); location.hash = 'uni'; }
    catch (err) { S.error = err.message || 'تعذّرت قراءة الملف. تأكد أنه بصيغة xlsx ومبني على القالب.'; route(); }
  };
  fr.onerror = () => { S.error = 'تعذّرت قراءة الملف.'; route(); };
  fr.readAsArrayBuffer(file);
}
document.getElementById('file').addEventListener('change', e => { readFile(e.target.files[0]); e.target.value = ''; });
document.getElementById('sampleBtn').addEventListener('click', () => { load(sampleRaw(), 'sample'); });
['dragover','dragenter'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); document.body.classList.add('drop'); }));
['dragleave','drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); document.body.classList.remove('drop'); }));
document.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) readFile(f); });
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
load(sampleRaw(), 'sample');
if (window.claude && typeof window.claude.use === 'function') { window.claude.use('sample').then(s => { if (s) { SAMPLE = s; renderChat(); } }).catch(() => {}); }
})();
</script>
